apiVersion: v1
kind: Namespace
metadata:
  name: vault-watchdogs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-watchdogs
  namespace: vault-watchdogs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-watchdogs
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-watchdogs
  namespace: vault
subjects:
- kind: ServiceAccount
  name: helm-watchdogs
  namespace: vault-watchdogs
roleRef:
  kind: Role
  name: helm-watchdogs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-watchdogs-leader
  namespace: vault-watchdogs
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-watchdogs-leader
  namespace: vault-watchdogs
subjects:
- kind: ServiceAccount
  name: helm-watchdogs
  namespace: vault-watchdogs
roleRef:
  kind: Role
  name: helm-watchdogs-leader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-watchdogs
  namespace: vault-watchdogs
  labels:
    app.kubernetes.io/name: helm-watchdogs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-watchdogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-watchdogs
    spec:
      serviceAccountName: helm-watchdogs
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: watchdog
        image: ghcr.io/nulldoot2k/helm-watchdogs/controller:0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LEASE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: WATCHDOG_NAMESPACE
          value: "vault"
        - name: VAULT_SERVICE
          value: "vault-active"
        - name: WATCHDOG_INTERVAL_SECONDS
          value: "10"
        - name: AUTO_UNSEAL
          value: "false"
        - name: ALLOW_POD_DELETE
          value: "false"
        - name: MAX_REMEDIATIONS_PER_HOUR
          value: "3"
        - name: METRICS_PORT
          value: "8080"
        - name: API_ENABLED
          value: "true"
        - name: API_PORT
          value: "8081"
        - name: UI_ENABLED
          value: "false"
        - name: WATCHDOGS_API_TOKEN_FILE
          value: /var/run/watchdogs-api/token
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: api
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: helm-watchdogs-api
  namespace: vault-watchdogs
  labels:
    app.kubernetes.io/name: helm-watchdogs
spec:
  selector:
    app.kubernetes.io/name: helm-watchdogs
  ports:
  - name: api
    port: 8081
    targetPort: api
    protocol: TCP
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watchdogsclusters.watchdogs.helm-watchdogs.dev
spec:
  group: watchdogs.helm-watchdogs.dev
  scope: Namespaced
  names:
    plural: watchdogsclusters
    singular: watchdogscluster
    kind: WatchdogsCluster
    shortNames: [wdc]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [provider, target]
            properties:
              provider:
                type: string
                enum: [vault]
              target:
                type: object
                required: [namespace, service]
                properties:
                  namespace: {type: string, minLength: 1}
                  service: {type: string, minLength: 1}
              policy:
                type: object
                properties:
                  mode: {type: string, enum: [observe, assist, managed]}
                  allowPodDelete: {type: boolean}
                  allowPVCDelete: {type: boolean}
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watchdogspolicies.watchdogs.helm-watchdogs.dev
spec:
  group: watchdogs.helm-watchdogs.dev
  scope: Namespaced
  names:
    plural: watchdogspolicies
    singular: watchdogspolicy
    kind: WatchdogsPolicy
    shortNames: [wdp]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              mode: {type: string, enum: [observe, assist, managed]}
              maxRemediationsPerHour: {type: integer, minimum: 0}
              requireBackupForPVCRecovery: {type: boolean}
              requireApprovalForDestructiveActions: {type: boolean}
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watchdogsincidents.watchdogs.helm-watchdogs.dev
spec:
  group: watchdogs.helm-watchdogs.dev
  scope: Namespaced
  names:
    plural: watchdogsincidents
    singular: watchdogsincident
    kind: WatchdogsIncident
    shortNames: [wdi]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [fingerprint, severity]
            properties:
              fingerprint: {type: string, minLength: 1}
              severity: {type: string, enum: [info, warning, critical]}
              action: {type: string}
          status:
            type: object
            properties:
              phase: {type: string}
              reason: {type: string}
              observedAt: {type: string, format: date-time}
    subresources:
      status: {}
---
apiVersion: v1
kind: Service
metadata:
  name: helm-watchdogs-metrics
  namespace: vault-watchdogs
  labels:
    app.kubernetes.io/name: helm-watchdogs
spec:
  selector:
    app.kubernetes.io/name: helm-watchdogs
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
