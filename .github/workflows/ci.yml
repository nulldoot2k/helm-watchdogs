name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Helm lint
        run: helm lint charts/helm-watchdogs
      - name: Helm template
        run: helm template helm-watchdogs charts/helm-watchdogs -n vault-watchdogs > /tmp/helm-watchdogs.yaml
      - name: Validate rendered Kubernetes YAML
        uses: instrumenta/kubeval@master
        with:
          files: /tmp/helm-watchdogs.yaml
      - name: Python syntax
        run: python3 -m py_compile src/watchdogs/controller/app.py
      - name: Controller unit tests
        working-directory: src/watchdogs/controller
        run: python3 -m unittest -v test_app.py test_decision.py
      - name: API unit tests
        working-directory: src/watchdogs/api
        run: python3 -m unittest -v test_server.py
      - name: Key service unit tests
        working-directory: src/watchdogs/key_service
        run: python3 -m unittest -v test_service.py test_server.py
      - name: Storage unit tests
        working-directory: src/watchdogs/storage
        run: python3 -m unittest -v test_store.py

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: src/watchdogs
          file: src/watchdogs/controller/Dockerfile
          push: false
          tags: helm-watchdogs/controller:ci
